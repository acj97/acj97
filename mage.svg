<svg xmlns="http://www.w3.org/2000/svg" width="160" height="200" viewBox="0 0 160 200">
  <rect width="160" height="200" fill="#0D1117"/>
  <rect x="0" y="180" width="160" height="20" fill="#161B22"/>

  <!-- robe -->
  <path d="M60 120 L100 120 L115 190 L45 190 Z" fill="#3D2B0A" stroke="#F9A825" stroke-width="2"/>

  <!-- casting arm -->
  <path d="M95 130 L130 90" stroke="#3D2B0A" stroke-width="10" stroke-linecap="round"/>

  <!-- head -->
  <circle cx="80" cy="100" r="18" fill="#E0B27A"/>

  <!-- hat -->
  <path d="M55 95 L80 38 L108 95 Z" fill="#5C3D0F" stroke="#F9A825" stroke-width="2"/>
  <circle cx="80" cy="38" r="4" fill="#F9A825"/>

  <!-- staff -->
  <line x1="95" y1="130" x2="136" y2="86" stroke="#916213" stroke-width="4" stroke-linecap="round"/>

  <!-- glowing orb at staff tip -->
  <circle cx="136" cy="86" r="6" fill="#F9A825">
    <animate attributeName="r" values="5;9;5" dur="1s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.6;1" dur="1s" repeatCount="indefinite"/>
  </circle>

  <!-- bolt fired toward the dragon -->
  <circle r="5" fill="#4FC3F7">
    <animateMotion path="M136,86 L159,86" dur="1s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.7;1" dur="1s" repeatCount="indefinite"/>
  </circle>
</svg>
