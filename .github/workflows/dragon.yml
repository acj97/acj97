name: generate dragon contribution grid

on:
  schedule:
    - cron: "0 */6 * * *"  # refresh every 6 hours
  workflow_dispatch: {}
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        id: dragon-svg
        with:
          github_user_name: acj97
          outputs: |
            dist/dragon-contribution-grid.svg?color_snake=%23F9A825&color_dots=%23161B22,%233D2B0A,%235C3D0F,%23916213,%23F9A825

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
